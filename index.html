<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bitácora de expedición por los tipos Pokémon, construida sobre la PokeAPI." />
    <title>Async Odyssey · Bitácora de tipos</title>
  </head>
  <body>
    <header class="cabecera">
      <p class="cabecera__antetitulo">Async Odyssey · Misión 2</p>
      <h1 class="cabecera__titulo">Bitácora de tipos</h1>
      <p class="cabecera__lema">«El event loop no espera a nadie.» Elige un tipo y sal de expedición.</p>
    </header>

    <main class="contenido">
      <section aria-labelledby="titulo-tipos">
        <h2 id="titulo-tipos" class="seccion__titulo">1 · Elige destino</h2>
        <div id="tipos" class="tipos"></div>
      </section>

      <section id="expedicion" aria-labelledby="titulo-expedicion" hidden>
        <h2 id="titulo-expedicion" class="seccion__titulo">2 · Diario de campo</h2>
        <div id="ficha" class="ficha"></div>

        <div id="controles" class="controles" hidden>
          <label class="campo">
            Buscar en este tipo
            <input id="buscador" type="search" placeholder="Nombre o número…" autocomplete="off" />
          </label>
          <label class="campo">
            Ordenar los mostrados por
            <select id="orden">
              <option value="id">Número de Pokédex</option>
              <option value="nombre">Nombre (A-Z)</option>
              <option value="total">Stats totales</option>
              <option value="velocidad">Velocidad</option>
              <option value="peso">Peso</option>
            </select>
          </label>
          <button id="vaciar-cache" class="boton boton--secundario" type="button">Vaciar caché</button>
        </div>

        <p id="barra-estado" class="barra-estado" aria-live="polite"></p>
        <div id="resumen" class="resumen"></div>
        <div id="resultados" class="resultados" aria-live="polite"></div>
        <div class="mas">
          <button id="cargar-mas" class="boton" type="button" hidden>Cargar más</button>
        </div>
      </section>
    </main>

    <footer class="pie">
      Datos de <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>.
      Proyecto académico · U-tad · Web Development I.
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
